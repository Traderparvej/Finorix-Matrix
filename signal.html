<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finorix Matrix — Signal Generator</title>
<style>
    body{
        background:#000;
        color:#0f0;
        font-family: monospace;
        padding:20px;
    }
    button{
        padding:10px 20px;
        background:#111;
        color:#0f0;
        border:1px solid #0f0;
        cursor:pointer;
        margin-top:10px;
    }
    #box{
        margin-top:20px;
        padding:20px;
        border:1px solid #0f0;
        white-space:pre-line;
    }
</style>
</head>
<body>

<h2>😈 FINORIX MATRIX — AI Signal 😈</h2>
<label>Asset: </label>
<input id="pair" value="EUR/CHF(OTC)"> <br><br>

<label>Total Signals: </label>
<input id="total" type="number" value="5"><br><br>

<button onclick="generate()">Generate Signals</button>

<div id="box"></div>

<script>
function generate(){
    let pair = document.getElementById("pair").value;
    let total = parseInt(document.getElementById("total").value);
    let now = new Date();
    let output = `😈    FINORIX MATRIX   😈\n\n⌛️ 1 Minutes\n\n`;

    for(let i=0; i<total; i++){
        // Random GAP: 4–8 minutes
        let gap = Math.floor(Math.random() * 5) + 4;
        now.setMinutes(now.getMinutes() + gap);

        let hh = now.getHours().toString().padStart(2,'0');
        let mm = now.getMinutes().toString().padStart(2,'0');

        // 50–50 Random CALL / PUT
        let signal = Math.random() < 0.5 ? "CALL" : "PUT";

        output += `${pair} | ${hh}:${mm} | ${signal}\n`;
    }

    output += `\n━━━━━━・━━━━━━\n😈 Avoid signal after Doji, <80%, Gap, or 3–4 B2B opposite candles 😈\n━━━━━━・━━━━━━`;

    document.getElementById("box").innerText = output;
}
</script>

</body>
</html>
