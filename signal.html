<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Finorix Matrix AI — Signal Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Share Tech Mono', monospace}
body{background:#000;color:#0f0;overflow-x:hidden;display:flex;justify-content:center;padding-top:20px;}
#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}
.panel{width:90%;max-width:900px;background:rgba(0,0,0,0.6);border:1px solid #0f0;padding:30px 28px;border-radius:12px;backdrop-filter:blur(6px);box-shadow:0 0 35px rgba(0,255,0,0.12);display:flex;flex-direction:column;}
.title{text-align:center;font-size:24px;margin-bottom:12px;text-shadow:0 0 12px #0f0;font-weight:bold;cursor:pointer;}
.row{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.row label{font-size:15px;color:#0f0;font-weight:600}
.row select,.row input{width:100%;padding:12px;background:#000;border:1px solid #0f0;color:#0f0;border-radius:8px;outline:none;font-size:14px;}
.btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.btn{flex:1;min-width:150px;padding:12px;background:linear-gradient(90deg,#00ff0f,#00cc8a);border:1px solid #0f0;color:#000;border-radius:8px;cursor:pointer;font-size:15px;font-weight:bold;text-shadow:0 0 6px #0f0;transition:.2s;box-shadow:0 0 20px rgba(0,255,0,0.5);}
.btn:hover{background:linear-gradient(90deg,#00cc8a,#00ff0f);box-shadow:0 0 24px #0f0}
.output{margin-top:20px;padding:14px;border:1px dashed rgba(0,255,0,0.3);min-height:220px;white-space:pre-line;overflow-y:auto;border-radius:8px;font-size:14px;line-height:1.4;}
#assetBox{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
#assetBox label{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:6px;border:1px solid rgba(0,255,0,0.2);transition:.2s;cursor:pointer;}
#assetBox label:hover{background:rgba(0,255,0,0.1);box-shadow:0 0 10px #0f0;}
#assetBox input[type="checkbox"]{accent-color:#0f0;}
.selectAllBtn{margin-top:6px;background:rgba(0,0,0,0.6);border:1px solid #0f0;padding:6px 10px;border-radius:6px;cursor:pointer;color:#0f0;text-shadow:0 0 4px #0f0;font-size:13px;align-self:start;}
.selectAllBtn:hover{background:rgba(0,40,0,0.7);box-shadow:0 0 10px #0f0;}
@media(max-width:500px){#assetBox{grid-template-columns:1fr;} .btns{flex-direction:column;}}
</style>
</head>
<body>
<canvas id="matrix"></canvas>

<div class="panel">
  <div class="title">FINORIX MATRIX — SIGNAL SYSTEM</div>

  <div class="row">
    <label>Time Zone (UTC)</label>
    <select id="timezone">
      <option value="6" selected>Bangladesh (UTC +06:00)</option>
      <option value="5">Pakistan (UTC +05:00)</option>
      <option value="0">UTC +00:00</option>
      <option value="7">UTC +07:00</option>
    </select>
  </div>

  <div class="row">
    <label>Market Type</label>
    <select id="marketType" onchange="updateAssets()">
      <option value="real">Real Market</option>
      <option value="otc">OTC Market</option>
      <option value="crypto">Crypto</option>
    </select>
  </div>

  <div class="row">
    <label>Assets (Tick to Select)</label>
    <div id="assetBox"></div>
    <button class="selectAllBtn" onclick="toggleSelectAll()">Select / Deselect All</button>
  </div>

  <div class="row">
    <label>Timeframe (Minutes)</label>
    <select id="tf">
      <option value="1">1 Minute</option>
      <option value="2">2 Minutes</option>
      <option value="3">3 Minutes</option>
      <option value="5">5 Minutes</option>
    </select>
  </div>

  <div class="row">
    <label>Number of Signals</label>
    <input id="count" type="number" value="5" min="1" />
  </div>

  <div class="btns">
    <button class="btn" onclick="generateSignals(parseInt(count.value)||5)">⚡ GENERATE SIGNALS ⚡</button>
    <button class="btn" onclick="copyAll()">COPY</button>
    <button class="btn" onclick="resetOut()">RESET</button>
  </div>

  <div class="output" id="out"></div>
</div>

<script>
// MATRIX EFFECT
const c=document.getElementById('matrix');
const ctx=c.getContext('2d');
let fontSize=16, cols, drops=[];
function resize(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/fontSize);drops=[...Array(cols)].map(()=>1);}
function draw(){
  ctx.fillStyle='rgba(0,0,0,0.05)';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle='#0f0';
  ctx.font=fontSize+'px Share Tech Mono';
  const chars='アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  drops.forEach((y,i)=>{
    ctx.fillText(chars[Math.random()*chars.length|0],i*fontSize,y*fontSize);
    if(y*fontSize>c.height&&Math.random()>0.975)drops[i]=0;
    drops[i]++;
  });
}
resize();setInterval(draw,40);addEventListener('resize',resize);

// ASSETS
const realAssets=["EUR/USD","GBP/USD","USD/JPY","AUD/JPY","EUR/JPY","GBP/JPY","USD/CAD","AUD/CAD","EUR/GBP","USD/CHF"];

const otcAssets=[
"USD/ARS(OTC)","USD/BDT(OTC)","USD/EGP(OTC)","USD/INR(OTC)","USD/IDR(OTC)","USD/MXN(OTC)",
"EUR/AUD(OTC)","EUR/CHF(OTC)","EUR/SGD(OTC)","GBP/CHF(OTC)","NZD/CAD(OTC)","AUD/NZD(OTC)",
"CAD/CHF(OTC)","EUR/NZD(OTC)","USD/PHP(OTC)","GBP/NZD(OTC)","USD/BRL(OTC)","USD/ZAR(OTC)",
"EUR/CAD(OTC)","AUD/CHF(OTC)","CHF/JPY(OTC)","NZD/CHF(OTC)","USD/COP(OTC)","USD/DZD(OTC)",
"USD/NGN(OTC)","USD/TRY(OTC)","USD/PKR(OTC)","NZD/JPY(OTC)","NZD/USD(OTC)"
];

const cryptoAssets=[
"Bitcoin (OTC)","Axie Infinity (OTC)","Polkadot (OTC)","Ethereum Classic (OTC)",
"Ethereum (OTC)","Floki (OTC)","Gala (OTC)","Hamster Kombat (OTC)",
"Chainlink (OTC)","Litecoin (OTC)","Melania Meme (OTC)","Pepe (OTC)",
"Shiba Inu (OTC)","Solana (OTC)","Toncoin (OTC)","Trump (OTC)",
"Dogwifhat (OTC)","Zcash (OTC)","TRON (OTC)","Bonk (OTC)",
"Ripple (OTC)","Cardano (OTC)","Avalanche (OTC)","Arbitrum (OTC)",
"Cosmos (OTC)","Bitcoin Cash (OTC)","Decentraland (OTC)","Beam (OTC)",
"Dogecoin (OTC)","Dash (OTC)","Aptos (OTC)","Binance Coin (OTC)","Celestia (OTC)"
];

function updateAssets(){
  assetBox.innerHTML='';
  const list=marketType.value==='real'?realAssets:marketType.value==='otc'?otcAssets:cryptoAssets;
  list.forEach(a=>{
    const l=document.createElement('label');
    const i=document.createElement('input');
    i.type='checkbox';i.value=a;
    l.append(a,i);assetBox.appendChild(l);
  });
}
updateAssets();

// SIGNAL GENERATOR
function generateSignals(count){
  const out=document.getElementById("out");
  out.textContent="";
  const assets=[...document.querySelectorAll('#assetBox input:checked')].map(x=>x.value);
  if(!assets.length)return alert("Select at least one asset");

  let now=new Date(Date.now()+timezone.value*3600000);
  let txt=`▶️ DATE: ${now.getUTCDate()}.${now.getUTCMonth()+1}.${now.getUTCFullYear()}\n\n`;
  let call=0,put=0;
  for(let i=0;i<count;i++){
    now.setMinutes(now.getMinutes()+Math.floor(Math.random()*5)+4);
    let dir=call<=put?"CALL":"PUT";
    dir==="CALL"?call++:put++;
    txt+=`${assets[Math.random()*assets.length|0]} | ${now.getUTCHours().toString().padStart(2,'0')}:${now.getUTCMinutes().toString().padStart(2,'0')} | ${dir}\n`;
  }
  out.textContent=txt;
}
function copyAll(){navigator.clipboard.writeText(out.textContent);}
function resetOut(){out.textContent="";}
function toggleSelectAll(){
  const b=[...document.querySelectorAll('#assetBox input')];
  const all=b.every(x=>x.checked);b.forEach(x=>x.checked=!all);
}
</script>
</body>
</html>
